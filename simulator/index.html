<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE SCREEN WEASELS — Dual Shell Simulator</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
      body {
        background-color: #0f1115;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      header {
        margin-bottom: 24px;
        text-align: center;
      }
      h1 { font-size: 20px; letter-spacing: 2px; color: #f8fafc; }
      p.subtitle { font-size: 13px; color: #64748b; margin-top: 4px; }
      .workspace {
        display: flex;
        gap: 32px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
      }
      .shell-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .shell-title {
        font-size: 11px;
        letter-spacing: 1px;
        color: #94a3b8;
        text-transform: uppercase;
      }
      .cyd-bezel {
        background: #eab308; /* Yellow CYD Bezel */
        padding: 16px 14px 20px 14px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
        position: relative;
      }
      .cyd-screen {
        width: 320px;
        height: 240px;
        background: #000000;
        border-radius: 4px;
        position: relative;
        overflow: hidden;
        cursor: crosshair;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
      }
      .edge-glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: 4px;
        transition: opacity 0.08s ease-out;
        opacity: 0;
        box-shadow: inset 0 0 16px #38bdf8, inset 0 0 6px #f43f5e;
      }
      .edge-glow.active { opacity: 0.85; }
      canvas { display: block; }
      .controls {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        background: #1e293b;
        padding: 10px 18px;
        border-radius: 8px;
        align-items: center;
      }
      button {
        background: #334155;
        color: #f8fafc;
        border: none;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover { background: #475569; }
      button.active { background: #10b981; color: #000; font-weight: bold; }
      .status { font-size: 11px; color: #94a3b8; margin-left: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>THE SCREEN WEASELS</h1>
      <p class="subtitle">Dual 320×240 Development Simulator (Pure Black Void + Procedural Faces)</p>
    </header>

    <div class="workspace">
      <div class="shell-container">
        <span class="shell-title">Screen Weasel A (CYD Left)</span>
        <div class="cyd-bezel">
          <div class="cyd-screen" id="screen-a">
            <canvas id="canvas-a" width="320" height="240"></canvas>
            <div class="edge-glow" id="glow-a"></div>
          </div>
        </div>
      </div>

      <div class="shell-container">
        <span class="shell-title">Screen Weasel B (CYD Right)</span>
        <div class="cyd-bezel">
          <div class="cyd-screen" id="screen-b">
            <canvas id="canvas-b" width="320" height="240"></canvas>
            <div class="edge-glow" id="glow-b"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="btn-face-1" class="active">1 Face</button>
      <button id="btn-face-3">3 Faces</button>
      <button id="btn-face-9">9 Faces</button>
      <button id="btn-debug">Debug Overlays: OFF</button>
      <button id="btn-migrate">Migrate Face</button>
      <span class="status" id="fps-label">FPS: -- | Hand: Inactive</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
