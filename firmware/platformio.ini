; PlatformIO Project Configuration for The Screen Weasels (ESP32-2432S028R / CYD)
[platformio]
default_envs = esp32-2432s028r
core_dir = ../.platformio

[env:esp32-2432s028r]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D WEASEL_STAGE_DIAGNOSTICS=1

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    bblanchon/ArduinoJson @ ^7.0.4
    Links2004/WebSockets @ ^2.4.1
